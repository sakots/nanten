  <g transform="translate(752 125) rotate(5 56 80)" filter="url(#shadow)">
    <use href="#tile"/>
    <g transform="translate(56 77)">
      <use href="#bamboo" transform="translate(-30 -29)"/>
      <use href="#bamboo" transform="translate(30 -29)"/>
      <use href="#bamboo" transform="translate(-15 -18) rotate(55) scale(.7)"/>
      <use href="#bamboo" transform="translate(15 -18) rotate(-55) scale(.7)"/>
      <use href="#bamboo" transform="translate(-30 29)"/>
      <use href="#bamboo" transform="translate(30 29)"/>
      <use href="#bamboo" transform="translate(-15 18) rotate(-55) scale(.7)"/>
      <use href="#bamboo" transform="translate(15 18) rotate(55) scale(.7)"/>
