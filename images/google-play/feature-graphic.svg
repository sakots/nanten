    <path d="M23 39H89 M34 54H78V87H34Z M35 71H77 M56 25V125 M54 88Q38 110 20 121 M58 88Q75 110 94 121" fill="none" stroke="#252e27" stroke-width="5" stroke-linejoin="round"/>
